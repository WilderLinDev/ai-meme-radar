# Copy to ~/.config/ai-meme-radar/settings.toml ($AMR_CONFIG_DIR overrides the folder).
# Never commit the real file. Environment variables win over this file:
#   GEFEI_API_TOKEN, AMR_DATA_DIR, AMR_REPORTS_DIR (and AMR_CONFIG_DIR picks the folder).
# The strict preflight gate needs: the Ge Fei token, the Lark
# destination (daily_parent) with a logged-in lark-cli identity. Nothing runs until all are ready.

[gefei]
token = ""                    # wc_mcp_… from https://seo.web.cafe/api/ (secret)
base_url = "https://seo.web.cafe"
refresh_days = 3              # batches finished this recently are re-fetched (contents may still change)
keyword_detail_limit = 40     # keyword_detail calls per sync, creative-relevant batch keywords only

[lark]
daily_parent = ""             # Wiki node token daily reports are created under (required)
opportunity_parent = ""       # same for in-depth reports; empty = daily_parent
identity = "user"             # lark-cli --as user|bot; log in once with `lark-cli auth login` (not stored here)
cli = "lark-cli"

[paths]
data_dir = ""                 # empty = ~/ai-meme-radar-data ($AMR_DATA_DIR overrides)
reports_dir = ""              # empty = <data_dir>/reports ($AMR_REPORTS_DIR overrides)
