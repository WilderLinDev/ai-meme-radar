name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Tests use a fake Ge Fei transport and a fake lark-cli: no credentials and no network calls.
      - run: uv run pytest -q
        env:
          GEFEI_API_TOKEN: ""
          AMR_CONFIG_DIR: ${{ runner.temp }}/amr-config
          AMR_DATA_DIR: ${{ runner.temp }}/amr-data
