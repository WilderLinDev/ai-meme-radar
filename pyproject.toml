[project]
name = "ai-meme-radar"
version = "3.0.0"
description = "Trend discovery, market research and template-opportunity assessment for AI creative products."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
