[project]
name = "ai-meme-radar"
version = "2.0.0"
description = "Daily overseas AI-meme video radar: decide which meme is worth an AI template today."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
  "matplotlib>=3.8",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
